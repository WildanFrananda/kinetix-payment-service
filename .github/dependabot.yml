version: 2
updates:
  - package-ecosystem: docker
    directories:
      - "/"
    target-branch: development
    schedule:
      interval: daily
      time: "07:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    groups:
      base-images:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: "deps(docker)"
  - package-ecosystem: gradle
    directories:
      - "/"
    target-branch: development
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    # Liquibase 5 is licensed FSL-1.1-ALv2, not Apache. Payment stays on 4.33 (the app through
    # ext['liquibase.version'], the changelog tool through liquibaseRuntime) until the owner decides to
    # move. The 3.x Gradle plugin belongs to Liquibase 5 and fails against 4.33 with `liquibase/Scope`.
    ignore:
      - dependency-name: "org.liquibase:liquibase-core"
        update-types:
          - version-update:semver-major
      - dependency-name: "org.liquibase.gradle"
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: "deps"
  - package-ecosystem: github-actions
    directories:
      - "/"
    target-branch: development
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "deps(actions)"
