# Secrets are read from the environment with the ${VAR:?message} form, which makes
# `docker compose` refuse to render at all when a value is missing rather than starting
# on a committed default (S1 / P0-SEC-02). Datastore ports are deliberately NOT published
# to the host: reach them from inside the compose network, or with `docker compose exec`.
version: '3.8'

services:
  kinetix-payment-postgres:
    image: postgres:16-alpine
    container_name: kinetix-payment-postgres
    restart: always
    environment:
      POSTGRES_DB: kinetix_payment_dev
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - payment_postgres_data:/var/lib/postgresql/data

volumes:
  payment_postgres_data:
