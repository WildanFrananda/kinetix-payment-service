plugins {
    id 'java-library'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'com.google.protobuf' version '0.9.4'
}

repositories {
    mavenCentral()
}

ext['liquibase.version'] = '4.33.0'
ext['jackson-bom.version'] = '3.1.7'

dependencies {
    implementation project(':modules:domain')
    implementation project(':modules:application')

    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.postgresql:postgresql'
    implementation 'tools.jackson.core:jackson-databind'

    implementation 'io.micrometer:micrometer-core'

    api 'org.springframework.boot:spring-boot-starter-grpc-server'
    implementation 'io.grpc:grpc-protobuf'
    implementation 'io.grpc:grpc-stub'
    compileOnly 'org.apache.tomcat:annotations-api:6.0.53'

    compileOnly 'org.liquibase:liquibase-core'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
}

tasks.named('bootJar') {
    enabled = false
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:4.35.1"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:1.83.1"
        }
    }
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                java {}
            }
            task.plugins {
                grpc {}
            }
        }
    }
}

sourceSets {
    main {
        java {
            srcDirs 'src/main/java',
                    'build/generated/source/proto/main/java',
                    'build/generated/source/proto/main/grpc'
        }
        proto {
            srcDir '../../.contracts/proto'
        }
    }
}
