server:
  port: ${PORT:8003}
  # On SIGTERM Tomcat stops accepting and lets already-dispatched requests finish. The budget is
  # compose's stop_grace_period, 30s: the gRPC server drains first for up to 10s (see
  # grpc.server.shutdown-grace-period), then this phase gets up to 15s, and the rest is context
  # teardown. Sum them before changing either — past 30s Docker sends SIGKILL and nothing drains.
  shutdown: graceful

spring:
  application:
    name: kinetix-payment-service
  lifecycle:
    timeout-per-shutdown-phase: 15s
  autoconfigure:
    exclude:
      # net.devh registers its own gRPC meters the moment a MeterRegistry bean exists, under
      # grpc.server.* names, plus the A66 stream tracers. Two vocabularies for one thing is the
      # exact failure the metric contract exists to prevent, so calls are counted in
      # GrpcServerMetricsInterceptor and nowhere else.
      - net.devh.boot.grpc.server.autoconfigure.GrpcServerMetricAutoConfiguration
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  liquibase:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

midtrans:
  # Kinetix stays on Midtrans sandbox even in production. Moving environments is this URL plus
  # the server key and nothing else — there is deliberately no is-production flag, because a
  # flag means the production path is a code path that never runs until it matters.
  server-key: ${MIDTRANS_SERVER_KEY}
  base-url: ${MIDTRANS_BASE_URL}
  # Both sides bounded. The adapter used to set a connect timeout and nothing else, so a gateway that
  # accepted the connection and never answered held a request thread for as long as it liked.
  connect-timeout-ms: ${MIDTRANS_CONNECT_TIMEOUT_MS:5000}
  request-timeout-ms: ${MIDTRANS_REQUEST_TIMEOUT_MS:15000}

# The identity service is the only thing on this platform that may sign a token. Every value
# here is required with no default: a fallback issuer or audience would mean a misconfigured
# deployment verifies tokens against the wrong authority and reports nothing.
logging:
  structured:
    format:
      # One JSON object per line on stdout. JsonLogFormatter reads the same MDC that
      # RequestIdFilter and PeerAuthorizationInterceptor already write and publishes it as
      # "request_id"; there is one carrier of the id in this process, not two.
      console: com.kinetix.payment.api.observability.JsonLogFormatter
  pattern:
    # The console falls back to this only if the structured format above is cleared.
    # %X{requestId} is what RequestIdFilter puts in the MDC. Empty for work that belongs to no
    # request — a scheduled sweep, a startup migration — rather than a made-up id.
    level: "%5p [%X{requestId:-}]"

kinetix:
  jwt:
    jwks-uri: ${IDENTITY_JWKS_URL}
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE}
  grpc:
    # Which services may call this server. Today only order — it already carries
    # payment_service.proto and is the caller escrow exists for. mTLS proves a peer holds a
    # certificate from our CA, which every service does; this is what makes the surface narrow.
    allowed-callers: ${GRPC_ALLOWED_CALLERS}
  reconciliation:
    # Defaults, not required environment. These are cadences, not credentials or topology: a wrong
    # value costs a little gateway traffic, and refusing to start over an unset one would take the
    # service down for something it can pick sensibly itself.
    #
    # How late a top-up has to be before it is asked about. Midtrans normally calls the notification
    # URL within seconds, so ten minutes is well past "in flight" and still well inside the window
    # where a customer is waiting for money they have already paid.
    pending-top-up-age: ${RECONCILIATION_PENDING_TOPUP_AGE:10m}
    top-up-interval: ${RECONCILIATION_TOPUP_INTERVAL:5m}
    # Most PENDING rows are top-ups the customer started and abandoned; they stay PENDING until the
    # gateway expires them, and each one costs a status call. 100 per run drains a real backlog over
    # a few sweeps without turning one run into a long burst of gateway traffic.
    top-up-batch-size: ${RECONCILIATION_TOPUP_BATCH_SIZE:100}
    escrow-interval: ${RECONCILIATION_ESCROW_INTERVAL:5m}
    # Both sweeps wait out startup rather than running against a context that is still wiring itself,
    # and they are offset from each other so two sets of wallet locks are not taken at the same moment.
    top-up-initial-delay: ${RECONCILIATION_TOPUP_INITIAL_DELAY:60s}
    escrow-initial-delay: ${RECONCILIATION_ESCROW_INITIAL_DELAY:90s}

grpc:
  server:
    # No default. compose declares GRPC_PORT for this service, and a fallback here would let the
    # topology and the process bind different ports with nothing reporting it.
    port: ${GRPC_PORT}
    # Server.shutdown() first: new calls are refused with UNAVAILABLE while calls already started
    # run to completion. Anything still running after this is ended by shutdownNow(), which fails
    # it with UNAVAILABLE rather than leaving the caller waiting on a socket that is about to go.
    shutdown-grace-period: 10s
    security:
      enabled: true
      certificateChain: file:${KINETIX_PKI_DIR:/pki}/tls.crt
      privateKey: file:${KINETIX_PKI_DIR:/pki}/tls.key
      trustCertCollection: file:${KINETIX_PKI_DIR:/pki}/ca.pem
      # REQUIRE, not OPTIONAL. With OPTIONAL a caller that presents no certificate still reaches
      # the interceptor, and the whole guarantee rests on that one check rather than on the
      # handshake refusing first.
      clientAuth: REQUIRE
