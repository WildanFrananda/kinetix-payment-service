# Payment's schema, owned by Liquibase.
#
# Generated by diffing the JPA entities against the database — the entities stay the single
# source of truth, the same way catalog's models are for Django and order's are for EF Core.
# Nothing here is hand-written DDL.
#
# To add a change: edit the entity, then run
#
#     DIFF_DB_URL=... DIFF_DB_USERNAME=... DIFF_DB_PASSWORD=... \
#       ./gradlew :modules:api:diffChangeLog
#
# and the new changesets are appended below. The application itself never applies them: it runs
# with liquibase.enabled=false and ddl-auto=validate, so it checks the schema and refuses to
# start if it disagrees, but only kinetix-payment-migrate may change it.
