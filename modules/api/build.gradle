plugins {
    id 'application'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'org.liquibase.gradle' version '2.2.2'
}

ext['liquibase.version'] = '4.33.0'
ext['tomcat.version'] = '11.0.26'
ext['jackson-bom.version'] = '3.1.7'

dependencies {
    implementation project(':modules:domain')
    implementation project(':modules:application')
    implementation project(':modules:infrastructure')

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    implementation 'org.springframework.boot:spring-boot-starter-liquibase'

    implementation 'io.micrometer:micrometer-registry-prometheus'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
}

dependencies {
    liquibaseRuntime 'org.liquibase:liquibase-core:4.33.0'
    liquibaseRuntime 'org.liquibase.ext:liquibase-hibernate7:5.0.4'
    liquibaseRuntime 'org.springframework.boot:spring-boot-starter-data-jpa'
    liquibaseRuntime 'org.postgresql:postgresql'
    liquibaseRuntime 'info.picocli:picocli:4.7.6'
    liquibaseRuntime 'org.yaml:snakeyaml'
    liquibaseRuntime project(':modules:infrastructure')
    liquibaseRuntime sourceSets.main.output
}

liquibase {
    activities {
        main {
            changelogFile "${projectDir}/src/main/resources/db/changelog/db.changelog-master.yaml"
            url System.getenv('DIFF_DB_URL')
            username System.getenv('DIFF_DB_USERNAME')
            password System.getenv('DIFF_DB_PASSWORD')
            referenceUrl 'hibernate:spring:com.kinetix.payment.infrastructure.persistence' +
                '?dialect=org.hibernate.dialect.PostgreSQLDialect'
        }
    }
}

tasks.matching { it.name.equalsIgnoreCase('diffChangeLog') || it.name.equalsIgnoreCase('generateChangeLog') }
    .configureEach {
        dependsOn ':modules:infrastructure:jar', ':modules:domain:jar', ':modules:application:jar', 'classes'
    }

application {
    mainClass = 'com.kinetix.payment.api.PaymentApplication'
}

springBoot {
    buildInfo()
}
